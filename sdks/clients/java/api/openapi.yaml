openapi: 3.1.0
info:
  description: "Agent observability, evaluation, gating, and human-review APIs for\
    \ Palette"
  license:
    name: Apache-2.0
  title: Palette API
  version: 0.1.0
servers:
- url: /
tags:
- description: Runtime health
  name: health
- description: "Trace ingestion, queue, and durability"
  name: ingest
- description: Trace read APIs
  name: traces
- description: Span read APIs
  name: spans
- description: Span search
  name: search
- description: Trace archival and archived-span queries
  name: archive
- description: "Prompt registry, versions, and diffs"
  name: prompts
- description: "Datasets, cases, and versions"
  name: datasets
- description: Scenario mining and replay data engine
  name: scenarios
- description: Dataset evaluations
  name: evals
- description: Baseline/candidate experiments
  name: experiments
- description: Official external evaluation evidence
  name: evalResults
- description: Evaluator calibration runs
  name: calibrations
- description: Release gates
  name: gates
- description: Ad-hoc judge evaluation and ledger
  name: judge
- description: Human review queues and annotations
  name: reviews
- description: Online sampling decisions
  name: online
- description: Alert policy evaluation
